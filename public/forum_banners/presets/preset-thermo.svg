<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-th" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0702" />
      <stop offset="50%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="flame-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg-th)" />

  <!-- Bunsen Burner & Heat Flames Left -->
  <g transform="translate(240, 160)">
    <!-- Base -->
    <rect x="-35" y="150" width="70" height="15" rx="3" fill="#64748b" />
    <rect x="-10" y="80" width="20" height="70" fill="#94a3b8" />
    <!-- Outer Flame -->
    <path d="M -30,80 Q -40,30 0,-40 Q 40,30 30,80 Z" fill="url(#flame-grad)" opacity="0.9" />
    <!-- Inner Flame Cone -->
    <path d="M -15,80 Q -20,50 0,10 Q 20,50 15,80 Z" fill="#67e8f9" opacity="0.8" />
  </g>

  <!-- Enthalpy Delta H Formula & Graph Right -->
  <g transform="translate(680, 130)">
    <rect x="0" y="0" width="380" height="150" rx="20" fill="#291205" stroke="#f97316" stroke-width="2" opacity="0.9" />
    <text x="30" y="55" fill="#fdba74" font-family="monospace" font-size="28" font-weight="bold">ΔH = H_products - H_reactants</text>
    <text x="30" y="95" fill="#fcd34d" font-family="monospace" font-size="20">ΔG = ΔH - TΔS</text>
    <text x="30" y="125" fill="#fb923c" font-family="sans-serif" font-size="12" font-weight="bold">EXOTHERMIC (ΔH &lt; 0) &bull; SPONTANEOUS</text>
  </g>
</svg>