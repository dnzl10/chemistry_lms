<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-org" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02211c" />
      <stop offset="50%" stop-color="#043831" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg-org)" />

  <!-- Organic Skeletal Chain Across Canvas -->
  <g stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="100,240 160,160 220,240 280,160 340,240 400,160 460,240 520,160" />
    <!-- Double Bond -->
    <line x1="284" y1="172" x2="336" y2="242" stroke="#6ee7b7" stroke-width="3" />
    <!-- Carbonyl =O -->
    <line x1="395" y1="160" x2="395" y2="80" stroke="#f43f5e" stroke-width="3.5" />
    <line x1="405" y1="160" x2="405" y2="80" stroke="#f43f5e" stroke-width="3.5" />
  </g>
  <text x="400" y="70" fill="#f43f5e" font-family="sans-serif" font-size="22" font-weight="black" text-anchor="middle">O</text>
  <!-- -OH Hydroxyl -->
  <line x1="520" y1="160" x2="570" y2="110" stroke="#38bdf8" stroke-width="3.5" />
  <text x="590" y="105" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold">OH</text>

  <!-- Fused Polycyclic Rings Right -->
  <g transform="translate(860, 200)" stroke="#10b981" stroke-width="3.5" fill="none">
    <!-- Ring 1 -->
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" />
    <circle cx="0" cy="0" r="35" stroke-dasharray="4,4" stroke="#6ee7b7" stroke-width="2" />
    <!-- Ring 2 -->
    <polygon points="60,-35 120,-70 180,-35 180,35 120,70 60,35" />
    <circle cx="120" cy="0" r="35" stroke-dasharray="4,4" stroke="#6ee7b7" stroke-width="2" />
    <!-- Methyl branch -->
    <line x1="180" y1="-35" x2="230" y2="-65" stroke="#34d399" stroke-width="3" />
    <text x="240" y="-70" fill="#a7f3d0" font-family="sans-serif" font-size="16" font-weight="bold">CH₃</text>
  </g>
</svg>