<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bond-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>
    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg-mol)" />
  <circle cx="280" cy="180" r="220" fill="url(#glow-cyan)" />
  <circle cx="880" cy="220" r="260" fill="url(#glow-cyan)" opacity="0.6" />
  
  <!-- Subtle Grid -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Molecular Bond Network Left -->
  <g stroke="url(#bond-grad)" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="260" x2="220" y2="180" />
    <line x1="220" y1="180" x2="340" y2="220" />
    <line x1="220" y1="180" x2="200" y2="70" />
    <line x1="340" y1="220" x2="440" y2="140" />
    <line x1="340" y1="220" x2="360" y2="330" />
    <line x1="440" y1="140" x2="560" y2="180" />
    <line x1="440" y1="140" x2="420" y2="50" />
  </g>
  <!-- Molecular Nodes Left -->
  <g filter="url(#node-glow)">
    <circle cx="120" cy="260" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="3" />
    <circle cx="220" cy="180" r="22" fill="#0369a1" stroke="#7dd3fc" stroke-width="4" />
    <circle cx="200" cy="70"  r="12" fill="#38bdf8" stroke="#bae6fd" stroke-width="2" />
    <circle cx="340" cy="220" r="18" fill="#4f46e5" stroke="#a5b4fc" stroke-width="3" />
    <circle cx="360" cy="330" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="3" />
    <circle cx="440" cy="140" r="20" fill="#0ea5e9" stroke="#bae6fd" stroke-width="4" />
    <circle cx="420" cy="50"  r="10" fill="#7dd3fc" stroke="#e0f2fe" stroke-width="2" />
    <circle cx="560" cy="180" r="16" fill="#6366f1" stroke="#c7d2fe" stroke-width="3" />
  </g>

  <!-- Large Benzene Ring & Orbitals Right -->
  <g transform="translate(900, 200) scale(1.1)">
    <!-- Benzene Hexagon -->
    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="10,6" opacity="0.8" />
    <!-- Inner Pi Cloud Circle -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#818cf8" stroke-width="3" opacity="0.6" stroke-dasharray="4,4" />
    <!-- Nodes -->
    <circle cx="0" cy="-100" r="12" fill="#0284c7" stroke="#bae6fd" stroke-width="3" />
    <circle cx="86.6" cy="-50" r="12" fill="#0284c7" stroke="#bae6fd" stroke-width="3" />
    <circle cx="86.6" cy="50" r="12" fill="#0284c7" stroke="#bae6fd" stroke-width="3" />
    <circle cx="0" cy="100" r="12" fill="#0284c7" stroke="#bae6fd" stroke-width="3" />
    <circle cx="-86.6" cy="50" r="12" fill="#0284c7" stroke="#bae6fd" stroke-width="3" />
    <circle cx="-86.6" cy="-50" r="12" fill="#0284c7" stroke="#bae6fd" stroke-width="3" />
    <!-- Peripheral Bonds -->
    <line x1="86.6" y1="-50" x2="160" y2="-90" stroke="#06b6d4" stroke-width="3" />
    <circle cx="160" cy="-90" r="8" fill="#38bdf8" />
    <line x1="86.6" y1="50" x2="160" y2="90" stroke="#06b6d4" stroke-width="3" />
    <circle cx="160" cy="90" r="8" fill="#38bdf8" />
    <line x1="-86.6" y1="-50" x2="-160" y2="-90" stroke="#06b6d4" stroke-width="3" />
    <circle cx="-160" cy="-90" r="8" fill="#38bdf8" />
  </g>

  <!-- Ambient Floating Atoms -->
  <circle cx="680" cy="90" r="6" fill="#38bdf8" opacity="0.5" />
  <circle cx="730" cy="140" r="4" fill="#818cf8" opacity="0.6" />
  <circle cx="640" cy="280" r="8" fill="#06b6d4" opacity="0.4" />
</svg>