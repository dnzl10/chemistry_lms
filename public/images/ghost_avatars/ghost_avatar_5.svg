  <ellipse cx="48" cy="48" rx="6" ry="7" fill="#1c0701"/>
  <ellipse cx="72" cy="48" rx="6" ry="7" fill="#1c0701"/>
  <circle cx="49" cy="47" r="2.5" fill="#fef08a"/>
  <circle cx="73" cy="47" r="2.5" fill="#fef08a"/>
  <!-- Plasma Flame Spark on Forehead -->
  <path d="M 60 28 Q 63 35 60 40 Q 57 35 60 28" fill="#fef08a"/>
  <!-- Solar Radiant Spark on Chest -->
  <circle cx="60" cy="72" r="4" fill="#fef08a"/>
