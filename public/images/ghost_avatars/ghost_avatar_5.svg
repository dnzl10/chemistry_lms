<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="plasmaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0701"/>
    </linearGradient>
    <linearGradient id="plasmaGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="pBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#plasmaBg)" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.6"/>
  <!-- Ghost Body -->
  <path d="M 60 22 C 44 22 35 35 35 52 C 35 68 32 82 35 88 C 37 92 42 87 47 90 C 52 93 55 87 60 90 C 65 87 68 93 73 90 C 78 87 83 92 85 88 C 88 82 85 68 85 52 C 85 35 76 22 60 22 Z" fill="url(#plasmaGlow)" filter="url(#pBlur)"/>
