<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="quantumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090520"/>
    </linearGradient>
    <linearGradient id="quantumGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="qBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#quantumBg)" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.6"/>
  <!-- Orbiting Atomic Rings -->
  <ellipse cx="60" cy="55" rx="42" ry="18" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3" transform="rotate(-25 60 55)" opacity="0.6"/>
  <ellipse cx="60" cy="55" rx="42" ry="18" fill="none" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="4 3" transform="rotate(35 60 55)" opacity="0.6"/>
  <!-- Ghost Body -->
  <path d="M 60 22 C 44 22 35 35 35 52 C 35 68 32 82 35 88 C 37 92 42 87 47 90 C 52 93 55 87 60 90 C 65 87 68 93 73 90 C 78 87 83 92 85 88 C 88 82 85 68 85 52 C 85 35 76 22 60 22 Z" fill="url(#quantumGlow)" filter="url(#qBlur)"/>
  <!-- Core Energy Wave Eyes -->
  <path d="M 44 48 Q 50 42 56 48" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 64 48 Q 70 42 76 48" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Nucleus Core -->
  <circle cx="60" cy="68" r="6" fill="#e0e7ff"/>
  <circle cx="60" cy="68" r="3" fill="#4338ca"/>
  <circle cx="35" cy="45" r="2.5" fill="#38bdf8"/>
  <circle cx="85" cy="65" r="2.5" fill="#38bdf8"/>
</svg>
