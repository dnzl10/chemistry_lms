<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="neonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344"/>
      <stop offset="100%" stop-color="#02131e"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <rect width="120" height="120" rx="28" fill="url(#neonBg)" stroke="#06b6d4" stroke-width="2.5" stroke-opacity="0.6"/>
  <!-- Glowing Ghost Body -->
  <path d="M 60 22 C 43 22 34 35 34 52 C 34 68 31 82 34 88 C 36 92 41 87 46 90 C 51 93 54 87 60 90 C 66 87 69 93 74 90 C 79 87 84 92 86 88 C 89 82 86 68 86 52 C 86 35 77 22 60 22 Z" fill="url(#neonGlow)" filter="url(#neonBlur)"/>
  <!-- Eyes / Cyber Goggles -->
  <ellipse cx="48" cy="48" rx="6.5" ry="7.5" fill="#02131e"/>
  <ellipse cx="72" cy="48" rx="6.5" ry="7.5" fill="#02131e"/>
  <circle cx="49" cy="46" r="2.5" fill="#a5f3fc"/>
  <circle cx="73" cy="46" r="2.5" fill="#a5f3fc"/>
  <!-- Cyber Visor / Brow Accent -->
  <path d="M 40 40 L 80 40" stroke="#a5f3fc" stroke-width="2" stroke-linecap="round"/>
  <!-- Chemical Flask Icon on Chest -->
  <path d="M 57 62 L 63 62 M 58.5 62 L 58.5 66 L 53 76 C 51.5 78.5 53 81 56 81 L 64 81 C 67 81 68.5 78.5 67 76 L 61.5 66 L 61.5 62" stroke="#02131e" stroke-width="2" fill="#a5f3fc" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bubbles inside flask -->
  <circle cx="58" cy="74" r="1.2" fill="#0891b2"/>
  <circle cx="62" cy="72" r="1.5" fill="#0891b2"/>
</svg>
