<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shadowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f051d"/>
    </linearGradient>
    <linearGradient id="shadowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#shadowBg)" stroke="#a855f7" stroke-width="2.5" stroke-opacity="0.6"/>
  <!-- Ghost Body with Cowl/Hood Contour -->
  <path d="M 60 20 C 40 20 32 36 32 54 C 32 70 30 84 33 89 C 36 93 42 88 47 91 C 52 94 55 88 60 91 C 65 88 68 94 73 91 C 78 88 84 93 87 89 C 90 84 88 70 88 54 C 88 36 80 20 60 20 Z" fill="url(#shadowGlow)" filter="url(#shadowBlur)"/>
  <!-- Dark Hood Shadow Inside -->
  <path d="M 60 26 C 44 26 38 40 38 52 C 38 64 42 70 60 70 C 78 70 82 64 82 52 C 82 40 76 26 60 26 Z" fill="#1e1035"/>
  <!-- Glowing Mystical Eyes -->
  <ellipse cx="49" cy="48" rx="5" ry="6" fill="#f3e8ff"/>
  <ellipse cx="71" cy="48" rx="5" ry="6" fill="#f3e8ff"/>
  <circle cx="50" cy="47" r="2" fill="#d946ef"/>
  <circle cx="72" cy="47" r="2" fill="#d946ef"/>
  <!-- Mystical Atom / Star Alchemy Sigil -->
